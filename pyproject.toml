[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gdscript-code-graph"
version = "1.0.0"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "gdtoolkit>=4.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pip-audit",
]

[project.scripts]
gdscript-code-graph = "gdscript_code_graph.cli:main"
